# ---------------------------------------------------------------------
# BDL API (Local Data Bank, bdl.stat.gov.pl) client - Committed Template
# ---------------------------------------------------------------------
# Read by the tray task "Write StatisticalDataCollections from BDL API"
# (UIStatisticalDataCollectionsWriteTask, Query.BDLClientId) from BDL.conf
# beside the application. CopyUserFiles runs after CopyFiles, so
# 'user files/BDL.conf' always overwrites this file in bin/ when present.
#
# To use a registered client id:
# 1. Register at https://api.stat.gov.pl/Home/BdlApi to get a client id.
# 2. Copy this file to 'user files/BDL.conf' (git-ignored, never committed).
# 3. Put the client id between the quotes of ClientId below.
#
# Left empty, the task runs with the anonymous BDL limits and logs a
# warning. A full write of a statistical unit file needs a registered id.
# The id travels in the X-ClientId request header and is never logged.
#
# Keep comment lines free of the equals sign: every line holding one is
# read as a setting.
# ---------------------------------------------------------------------

# BDL API client id (X-ClientId). Empty means anonymous.
ClientId=""
